<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Central da Consultoria</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/marca/icone.png">
<style>
  @font-face { font-family: 'Krona'; src: url('/fonts/KronaOne.ttf') format('truetype'); }
  @font-face { font-family: 'Exo'; src: url('/fonts/Exo2.ttf') format('truetype'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: #000; color: #fff; font: 400 16px/1.5 'Exo', system-ui, sans-serif;
         display: grid; place-items: center; padding: 24px 16px; }
  form { width: 100%; max-width: 320px; display: grid; gap: 18px; justify-items: center; text-align: center; }
  h1 { font: 400 17px/1.3 'Krona'; }
  input { width: 100%; font: 400 28px 'Krona'; letter-spacing: .3em; text-align: center; padding: 14px 10px;
          border: 0; border-radius: 10px; background: #fff; color: #000; }
  button { width: 100%; font: 600 16px 'Exo'; padding: 14px; border-radius: 999px; border: 1.5px solid #fff;
           background: #000; color: #fff; }
  .erro { color: #ff9b94; font-weight: 600; min-height: 1.5em; }
</style>
</head>
<body>
<form method="post" action="/celular">
  <img src="/marca/gorila.png" alt="" width="64" height="59">
  <h1>Central da Consultoria</h1>
  <input name="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" aria-label="Senha" autofocus required>
  <button type="submit">Entrar</button>
  <p class="erro" role="alert">{{erro}}</p>
</form>
</body>
</html>
